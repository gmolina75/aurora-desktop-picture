name: Pruebas

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar fuentes en Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Verificar scripts de Bash
        if: runner.os == 'Linux'
        run: |
          for script in install.sh actualizar.sh actualizar-github.sh desinstalar.sh; do
            bash -n "$script"
          done

      - name: Verificar sintaxis del instalador de PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errores = $null
          $ruta = (Resolve-Path instalar-windows.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($ruta, [ref]$tokens, [ref]$errores) | Out-Null
          if ($errores.Count) {
            $errores | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Comprobar el BAT de Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: actualizar.bat --version

      - name: Generar y verificar un PNG
        run: |
          python generate_wallpaper.py --no-set --output aurora-ci.png
          python -c "from PIL import Image; Image.open('aurora-ci.png').verify()"
